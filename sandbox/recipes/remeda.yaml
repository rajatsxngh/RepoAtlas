# remeda/remeda v2.59.0 — TypeScript, medium. MIT. Pinned by package-lock.json; only the
# library workspace is installed (not the docs site). Install scripts are skipped.
id: remeda
url: https://github.com/remeda/remeda
commit: "ec4d3f5dad1105c522c83ec4877e04937cb2405e"
language: typescript
base_image: node
install:
  - "npm ci --ignore-scripts --no-audit --no-fund -w packages/remeda"
  # Vite and Vitest write caches into node_modules; point them at the writable /tmp.
  - "for d in . packages/remeda; do mkdir -p $d/node_modules && for c in .vite-temp .vite .vitest-cache; do ln -sfn /tmp/$c $d/node_modules/$c; done; done"
test:
  cmd: "mkdir -p /tmp/.vite-temp /tmp/.vite /tmp/.vitest-cache && cd packages/remeda && ../../node_modules/.bin/vitest run --project runtime --reporter=json --outputFile=/tmp/out/report"
  reporter: vitest-json
  timeout_s: 900
scip:
  indexer: scip-typescript
  cwd: packages/remeda  # the library project (its tsconfig includes src and test)
  args: ["index", "--output", "/tmp/out/index.scip"]
quarantine: []
