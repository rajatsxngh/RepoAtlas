# gvergnaud/ts-pattern v5.9.2 — TypeScript, small. MIT. Pinned by package-lock.json; install
# scripts are skipped. Calibration only.
id: ts-pattern
url: https://github.com/gvergnaud/ts-pattern
commit: "f11be73acb18e1d653d4f252e7d75981d873a2e6"
language: typescript
base_image: node
install:
  - "npm ci --ignore-scripts --no-audit --no-fund"
test:
  cmd: "node_modules/.bin/jest --json --outputFile=/tmp/out/report"
  reporter: jest-json
  timeout_s: 600
scip:
  indexer: scip-typescript
  # tsconfig.json includes only src/; index the tests too, from a writable copy.
  workdir: tmp
  setup:
    - "mv tsconfig.json tsconfig.base.json"
    - "printf '{\"extends\": \"./tsconfig.base.json\", \"include\": [\"src/\", \"tests/\"], \"exclude\": [\"dist/\", \"examples/\", \"node_modules/\"]}' > tsconfig.json"
  args: ["index", "--output", "/tmp/out/index.scip"]
quarantine: []
