# Ruff settings for repo-level scripts (scripts/). The backend has its own settings in
# backend/pyproject.toml; Ruff always uses the closest configuration file.
line-length = 100
target-version = "py311"  # the docs lint must run on any Python 3.11+

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
