name: CI

on:
  push:
    branches: [main, "m*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux, full checks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repoatlas
          POSTGRES_PASSWORD: repoatlas
          POSTGRES_DB: repoatlas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repoatlas -d repoatlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REPOATLAS_DATABASE_URL: postgresql+psycopg://repoatlas:repoatlas@localhost:5433/repoatlas
      REPOATLAS_LOG_FORMAT: json
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint, type-check, test, docs lint
        run: uv run poe check
      - name: Fixture parse digests (the golden tests require identical output on every OS)
        run: |
          uv run repoatlas parse tests/fixtures/repos/py_small
          uv run repoatlas parse tests/fixtures/repos/ts_small
      - name: Fixture graph digests (the golden tests require identical output on every OS)
        run: |
          uv run repoatlas graph tests/fixtures/repos/py_small
          uv run repoatlas graph tests/fixtures/repos/ts_small
      - name: Migrations apply to the service database
        run: uv run repoatlas db upgrade && uv run repoatlas db current
      - name: The committed OpenAPI spec matches the code
        run: uv run repoatlas api openapi --out openapi.json --check

  backend-windows:
    name: Backend (Windows, unit tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run poe test-unit
      - name: Fixture parse digests (must match the Linux job)
        run: |
          uv run repoatlas parse tests/fixtures/repos/py_small
          uv run repoatlas parse tests/fixtures/repos/ts_small
      - name: Fixture graph digests (must match the Linux job)
        run: |
          uv run repoatlas graph tests/fixtures/repos/py_small
          uv run repoatlas graph tests/fixtures/repos/ts_small

  api-types:
    name: API types (generated from the committed spec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the pinned generator
        run: npm ci --no-audit --no-fund
      - name: The committed TypeScript types match backend/openapi.json
        run: |
          npx --no openapi-typescript ../backend/openapi.json --output src/lib/api/schema.d.ts
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::frontend/src/lib/api/schema.d.ts is stale. Run scripts/gen_api_types.sh and commit it."
            exit 1
          }

  frontend:
    name: Frontend (lint, types, unit tests, end to end)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint and formatting
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Milestone docs lint
        run: python scripts/check_milestones.py
