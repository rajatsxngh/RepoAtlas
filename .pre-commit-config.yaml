# Install once with:  cd backend && uv run pre-commit install
# Run on everything:  cd backend && uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Mutation ground truth is text that later milestones read; it stays in git (~2 MB).
        # The README's demo recording is a GIF of about 3 MB.
        exclude: ^(eval/artifacts/[^/]+/[0-9a-f]{40}/mutations\.jsonl|docs/launch/demo\.gif)$

  # Ruff runs from the backend environment so its version always matches uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types: [python]
      - id: docs-lint
        name: milestone docs lint
        entry: uv run --project backend python scripts/check_milestones.py
        language: system
        pass_filenames: false
        files: ^(docs/|scripts/check_milestones\.py$)
      - id: link-check
        name: links in the README and docs
        entry: uv run --project backend python scripts/check_links.py
        language: system
        pass_filenames: false
        files: (\.md$|^scripts/check_links\.py$)
