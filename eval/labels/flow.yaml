- id: f05
  question_id: httpx-flow-004
  question: When `Client.send` loads a non-streamed response whose `Content-Encoding` is gzip, how are
    the raw bytes pulled from the transport stream and decompressed into `response.content`?
  reference_outline: '1. After the auth and redirect handling returns a response, `Client.send` calls
    `response.read()` unless `stream=True` was requested, closing the response if reading fails.

    2. `Response.read` sets the content to the joined output of `iter_bytes` if it was not already loaded.

    3. `iter_bytes` gets a decoder from `_get_content_decoder`, which maps each `Content-Encoding` value
    through the `SUPPORTED_DECODERS` table ("gzip" maps to `GZipDecoder`), using a `MultiDecoder` for
    several encodings and an `IdentityDecoder` for none.

    4. `iter_raw` refuses a consumed or closed stream, then iterates the response''s stream, counting
    downloaded bytes, and closes the response when done.

    5. That stream is the `BoundSyncStream` set in `_send_single_request`, whose `__iter__` simply yields
    the chunks of the transport''s stream.

    6. Each raw chunk goes through `GZipDecoder.decode`, which decompresses it with a zlib object set
    up for gzip framing and turns zlib errors into `DecodingError`; `iter_bytes` then flushes the decoder
    and the chunker so the trailing bytes are included.'
  must_cite:
  - py:httpx/_client.py:Client.send:method
  - py:httpx/_models.py:Response.read:method
  - py:httpx/_models.py:Response.iter_bytes:method
  - py:httpx/_models.py:Response._get_content_decoder:method
  - py:httpx/_models.py:Response.iter_raw:method
  - py:httpx/_decoders.py:GZipDecoder.decode:method
  answer: 'The evidence only shows the first step: when `stream` is false, `Client.send` calls `response.read()`
    after `_send_handling_auth` returns, and closes the response and re-raises if that fails [c1]. The
    code for `Response.read`, the stream iteration, and the gzip decoder is not in the provided excerpts,
    so I can''t say how the bytes are pulled from the transport stream or decompressed into `response.content`.
    The excerpts also don''t show how `Content-Encoding` is handled.


    Claims:

    - Client.send calls response.read() when stream is False, and on any BaseException it closes the response
    and re-raises.'
