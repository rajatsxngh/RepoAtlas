- id: f04
  question_id: click-flow-004
  question: When Bash asks for tab completion of a group's subcommand name (for example `cli sy<TAB>`
    with `_CLI_COMPLETE=bash_complete`), how does Click compute and print the candidates?
  reference_outline: '1. `Command.main` calls `_main_shell_completion` before normal parsing; it derives
    the variable name `_{PROG_NAME}_COMPLETE`, returns if it is unset, and otherwise calls `shell_completion.shell_complete`
    and exits with its return code.

    2. `shell_complete` splits the instruction into shell and action, looks up the completion class with
    `get_completion_class` (Bash here), and for the `complete` action echoes the result of `complete()`.

    3. `ShellComplete.complete` gets the arguments and the incomplete word, calls `get_completions`, and
    joins one formatted line per item.

    4. `BashComplete.get_completion_args` splits `COMP_WORDS`, uses `COMP_CWORD` to separate the finished
    arguments from the word being completed.

    5. `ShellComplete.get_completions` builds the context with `_resolve_context`, picks the object to
    complete with `_resolve_incomplete`, and calls that object''s `shell_complete`.

    6. `_resolve_context` makes the root context with `resilient_parsing=True` and walks down through
    any subcommands already typed, using `resolve_command` and `make_context`, without running callbacks.

    7. `_resolve_incomplete` sees that the incomplete word is not an option and no argument is waiting
    for a value, so it returns the current command (the group).

    8. `Group.shell_complete` yields a `CompletionItem` for each visible subcommand whose name starts
    with the incomplete word (with its short help), then appends whatever the base `Command.shell_complete`
    adds (option names only when the word starts with a non-alphanumeric character, and siblings from
    chained parent groups); `BashComplete.format_completion` writes each item as `type,value`.'
  must_cite:
  - py:src/click/core.py:Command._main_shell_completion:method
  - py:src/click/shell_completion.py:shell_complete:function
  - py:src/click/shell_completion.py:ShellComplete.complete:method
  - py:src/click/shell_completion.py:BashComplete.get_completion_args:method
  - py:src/click/shell_completion.py:ShellComplete.get_completions:method
  - py:src/click/shell_completion.py:_resolve_context:function
  - py:src/click/shell_completion.py:_resolve_incomplete:function
  - py:src/click/core.py:Group.shell_complete:method
  answer: 'Click''s Bash completion lives in `src/click/shell_completion.py`. The generated Bash script
    sets `COMP_WORDS` and `COMP_CWORD` and calls the program with `_CLI_COMPLETE=bash_complete`. Click
    then handles this in `shell_completion`/`_main_shell_completion`, which builds a `BashComplete` object
    and prints its output. I am recalling this from memory and have not checked it against this exact
    commit. [c1][c2][c3]


    1. `BashComplete.get_completion_args` reads `COMP_WORDS` and `COMP_CWORD` from the environment, splits
    them with `split_arg_string`, and returns `(args, incomplete)`. [c4]

    2. `ShellComplete.get_completions` calls `_resolve_context` to walk the args down to the right context,
    which here is the group. [c5]

    3. It then calls `_resolve_incomplete` to decide what is being completed. If the incomplete word is
    not an option or argument value, the command is asked for completions. [c6]

    4. For a group, `Command.shell_complete` includes subcommand names from `list_commands(ctx)` that
    start with the incomplete text (`sy`). Hidden commands are skipped. Each match becomes a `CompletionItem`.
    [c7]

    5. `BashComplete.format_completion` formats each item as `type,value`, for example `plain,sync`. The
    items are joined with newlines and printed to stdout. The Bash script then turns them into `COMPREPLY`.
    [c8]


    Claims:

    - Bash completion is implemented in src/click/shell_completion.py, with a Bash script template that
    invokes the program with _CLI_COMPLETE set to bash_complete.

    - The generated Bash script passes COMP_WORDS and COMP_CWORD to the program through the environment.

    - shell_completion in src/click/shell_completion.py handles the completion request by creating a BashComplete
    object and printing its output.

    - BashComplete.get_completion_args in src/click/shell_completion.py reads COMP_WORDS and COMP_CWORD,
    splits them, and returns args and the incomplete word.

    - ShellComplete.get_completions in src/click/shell_completion.py resolves the context from the args
    via _resolve_context.

    - _resolve_incomplete in src/click/shell_completion.py determines which object is being completed.

    - Command.shell_complete in src/click/core.py, for a group, adds subcommand names from list_commands
    that start with the incomplete text, skipping hidden commands, as CompletionItem objects.

    - BashComplete.format_completion in src/click/shell_completion.py formats each item as ''type,value'',
    and the items are printed one per line.'
