- id: f04
  question_id: httpx-flow-004
  question: When `Client.send` loads a non-streamed response whose `Content-Encoding` is gzip, how are
    the raw bytes pulled from the transport stream and decompressed into `response.content`?
  reference_outline: '1. After the auth and redirect handling returns a response, `Client.send` calls
    `response.read()` unless `stream=True` was requested, closing the response if reading fails.

    2. `Response.read` sets the content to the joined output of `iter_bytes` if it was not already loaded.

    3. `iter_bytes` gets a decoder from `_get_content_decoder`, which maps each `Content-Encoding` value
    through the `SUPPORTED_DECODERS` table ("gzip" maps to `GZipDecoder`), using a `MultiDecoder` for
    several encodings and an `IdentityDecoder` for none.

    4. `iter_raw` refuses a consumed or closed stream, then iterates the response''s stream, counting
    downloaded bytes, and closes the response when done.

    5. That stream is the `BoundSyncStream` set in `_send_single_request`, whose `__iter__` simply yields
    the chunks of the transport''s stream.

    6. Each raw chunk goes through `GZipDecoder.decode`, which decompresses it with a zlib object set
    up for gzip framing and turns zlib errors into `DecodingError`; `iter_bytes` then flushes the decoder
    and the chunker so the trailing bytes are included.'
  must_cite:
  - py:httpx/_client.py:Client.send:method
  - py:httpx/_models.py:Response.read:method
  - py:httpx/_models.py:Response.iter_bytes:method
  - py:httpx/_models.py:Response._get_content_decoder:method
  - py:httpx/_models.py:Response.iter_raw:method
  - py:httpx/_decoders.py:GZipDecoder.decode:method
  answer: 'When `stream` is false, `Client.send` calls `response.read()` after `_send_handling_auth` returns.
    [c1] `read()` sets `_content` to the joined output of `iter_bytes()`. [c2] `iter_bytes()` (when `_content`
    isn''t yet set) gets a decoder from `_get_content_decoder()` and creates a `ByteChunker`. [c3] It
    loops over `iter_raw()`, which yields the raw bytes from the transport stream, and passes each piece
    through `decoder.decode`. The decoded output goes through the chunker. After the loop it calls `decoder.flush()`
    and `chunker.flush()` for the remaining output. [c3] For gzip, the decoder class is `GZipDecoder`,
    whose `flush` calls `self.decompressor.flush()` and wraps `zlib.error` in `DecodingError`. [c4][c5]
    Once `_content` is set, the `content` property returns it. [c6]


    The evidence doesn''t show the body of `_get_content_decoder`, `iter_raw`, or `GZipDecoder.decode`,
    so how the Content-Encoding header selects the gzip decoder and how `iter_raw` reads from the transport
    are not covered.


    Claims:

    - Client.send calls response.read() when stream is False, after obtaining the response from _send_handling_auth.

    - Response.read sets _content to b"".join(self.iter_bytes()) if not already set.

    - iter_bytes obtains a decoder via _get_content_decoder, iterates iter_raw(), decodes each raw chunk
    with decoder.decode, passes it through a ByteChunker, then flushes the decoder and chunker.

    - GZipDecoder is the decoder class that handles ''gzip'' decoding.

    - GZipDecoder.flush returns self.decompressor.flush() and converts zlib.error into DecodingError.

    - The content property returns the stored _content, raising ResponseNotRead if it hasn''t been read.'
