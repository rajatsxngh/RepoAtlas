- id: f02
  question_id: requests-flow-004
  question: When a caller passes both `files=` and a dict `data=`, how does requests build the multipart
    body and set its Content-Type and Content-Length headers?
  reference_outline: '1. `Session.prepare_request` builds a `PreparedRequest` and calls its `prepare`
    with the request''s files and data.

    2. `prepare` runs the steps in order (method, URL, headers, cookies, body, auth, hooks); the body
    step is `prepare_body`.

    3. A dict is not treated as a streamed body, so `prepare_body` takes the non-streaming branch and,
    because files were given, calls `_encode_files` with the files and data.

    4. `_encode_files` rejects a missing files value or string data, turns each data field into a (name,
    bytes) pair, turns each file entry (a bare file object or a 2-, 3- or 4-tuple of filename, file object,
    content type, headers) into a urllib3 `RequestField`, reading file objects, and encodes everything
    with urllib3''s `encode_multipart_formdata`, returning the body and a multipart Content-Type with
    its boundary.

    5. `prepare_body` then calls `prepare_content_length`, which measures the body with `super_len` and
    sets Content-Length when the length is non-zero.

    6. Finally `prepare_body` sets the multipart Content-Type only if the caller did not supply one, and
    stores the body on the request.'
  must_cite:
  - py:src/requests/models.py:PreparedRequest.prepare:method
  - py:src/requests/models.py:PreparedRequest.prepare_body:method
  - py:src/requests/models.py:RequestEncodingMixin._encode_files:method
  - py:src/requests/models.py:PreparedRequest.prepare_content_length:method
  - py:src/requests/utils.py:super_len:function
  answer: 'When `files=` is given, `PreparedRequest.prepare_body` calls `_encode_files(files, data)` in
    `src/requests/models.py` (`requests/models.py` in older layouts) to build the multipart body, and
    `prepare_content_length` sets Content-Length. [c1][c2][c3][c4][c5] I''m recalling this from memory
    of the library, not from the code at this exact commit, so check the details against the source.


    Claims:

    - In src/requests/models.py, PreparedRequest.prepare_body takes the multipart path when files is truthy,
    calling self._encode_files(files, data) to get body and content_type.

    - RequestEncodingMixin._encode_files in src/requests/models.py turns each key/value in the dict data
    into a form field (values that are lists are expanded, and str values are encoded to bytes) and adds
    each file as a file part, using urllib3''s encode_multipart_formdata.

    - _encode_files returns the encoded body and a content type of the form multipart/form-data; boundary=...,
    which comes from encode_multipart_formdata.

    - In prepare_body, the Content-Type header is set from the returned content_type only if the user
    has not already supplied a Content-Type header.

    - prepare_body then calls prepare_content_length(body), which sets Content-Length from super_len(body),
    or 0 for an empty non-streamed body.'
