- id: f01
  question_id: requests-flow-004
  question: When a caller passes both `files=` and a dict `data=`, how does requests build the multipart
    body and set its Content-Type and Content-Length headers?
  reference_outline: '1. `Session.prepare_request` builds a `PreparedRequest` and calls its `prepare`
    with the request''s files and data.

    2. `prepare` runs the steps in order (method, URL, headers, cookies, body, auth, hooks); the body
    step is `prepare_body`.

    3. A dict is not treated as a streamed body, so `prepare_body` takes the non-streaming branch and,
    because files were given, calls `_encode_files` with the files and data.

    4. `_encode_files` rejects a missing files value or string data, turns each data field into a (name,
    bytes) pair, turns each file entry (a bare file object or a 2-, 3- or 4-tuple of filename, file object,
    content type, headers) into a urllib3 `RequestField`, reading file objects, and encodes everything
    with urllib3''s `encode_multipart_formdata`, returning the body and a multipart Content-Type with
    its boundary.

    5. `prepare_body` then calls `prepare_content_length`, which measures the body with `super_len` and
    sets Content-Length when the length is non-zero.

    6. Finally `prepare_body` sets the multipart Content-Type only if the caller did not supply one, and
    stores the body on the request.'
  must_cite:
  - py:src/requests/models.py:PreparedRequest.prepare:method
  - py:src/requests/models.py:PreparedRequest.prepare_body:method
  - py:src/requests/models.py:RequestEncodingMixin._encode_files:method
  - py:src/requests/models.py:PreparedRequest.prepare_content_length:method
  - py:src/requests/utils.py:super_len:function
  answer: 'When `files` and a dict `data` are both given, `prepare_body` takes the non-streamed branch,
    because a dict is excluded from the stream check. It calls `_encode_files(files, raw_data)` to get
    the body and the content type. [c1][c2]


    `_encode_files` turns the data fields into `(name, bytes)` tuples. A value that is a non-string iterable
    is expanded into multiple fields, and `None` values are skipped. [c3] Each file entry becomes a `RequestField`
    with `make_multipart`. Entries can be a bare file, or a 2-, 3- or 4-tuple, which supplies the filename,
    content type and extra headers. [c4] Everything is then encoded with `encode_multipart_formdata`,
    which returns the body and the content type. [c5]


    Back in `prepare_body`, `prepare_content_length(body)` sets `Content-Length` to `super_len(body)`
    when that length is non-zero. [c6] `Content-Type` is set from the encoder''s result only if the caller
    has not already supplied a `content-type` header. [c7]


    Claims:

    - With files and non-stream data, prepare_body calls self._encode_files(files, raw_data) to produce
    the body and content_type.

    - Mapping data (such as a dict) is excluded from the streamed-body branch, so it goes to the else
    branch.

    - _encode_files converts data fields into (name, bytes) tuples, expanding non-string iterable values
    and skipping None values.

    - Each file becomes a RequestField made multipart with an optional content type. Tuples of length
    2, 3 or 4 provide the filename, content type and headers.

    - The body and content type come from encode_multipart_formdata(new_fields).

    - prepare_content_length sets the Content-Length header to the string of super_len(body) when the
    length is non-zero.

    - The Content-Type header is set from the encoder''s content type only if no content-type header is
    already present.'
