  answer: 'With the default `trailing` timing, the first call starts a cool-down window and the wrapped
    function is not called right away. It is invoked when the cool-down timer fires.


    - `timing` defaults to `"trailing"` [c1].

    - On a call with no active cool-down (`coolDownTimeoutId` undefined), trailing timing sends the call
    to `handleDebouncedCall`, which saves the args as `latestCallArgs` [c2]. If `maxWaitMs` is set, it
    also starts a max-wait timeout once [c3].

    - `call` then arms `coolDownTimeoutId = setTimeout(handleCoolDownEnd, waitMs ?? maxWaitMs ?? 0)` [c4].

    - A further call during the window is also debounced: it replaces the saved args, and the existing
    cool-down timeout is cleared and re-armed, so the wait restarts [c5].

    - When the timer fires, `handleCoolDownEnd` clears the timeout and, if `latestCallArgs` is set, calls
    `handleInvoke` [c6].

    - `handleInvoke` clears any max-wait timer, takes and resets `latestCallArgs`, calls `func(...args)`
    and stores the return value in `result` [c7].

    - `call` returns the cached `result`, which is `undefined` until the first invocation has happened
    [c8].

    - `flush` triggers the same end-of-cool-down handling manually [c9].


    Claims:

    - The `timing` option defaults to "trailing" in `debounce`.

    - When no cool-down is active and timing is "trailing", `call` invokes `handleDebouncedCall(args)`
    instead of calling `func`, and that stores the args in `latestCallArgs`.

    - If `maxWaitMs` is defined, `handleDebouncedCall` starts a max-wait timeout (once) that runs `handleInvoke`.

    - After handling the call, `call` sets `coolDownTimeoutId` via `setTimeout(handleCoolDownEnd, waitMs
    ?? maxWaitMs ?? 0)`.

    - A call during an in-flight cool-down (timing not "leading") is debounced and the existing cool-down
    timeout is cleared before a new one is set.

    - `handleCoolDownEnd` clears the cool-down timeout and, if `latestCallArgs` is defined, invokes `handleInvoke`.

    - `handleInvoke` clears the max-wait timeout, consumes `latestCallArgs`, calls `func(...args)` and
    stores the result in `result`.

    - `call` returns the last computed `result` while debouncing, which is undefined before the first
    invocation.

    - `flush` calls `handleCoolDownEnd` to end the cool-down immediately and returns `result`.'
