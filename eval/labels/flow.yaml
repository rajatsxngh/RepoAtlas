- id: f05
  question_id: click-flow-004
  question: When Bash asks for tab completion of a group's subcommand name (for example `cli sy<TAB>`
    with `_CLI_COMPLETE=bash_complete`), how does Click compute and print the candidates?
  reference_outline: '1. `Command.main` calls `_main_shell_completion` before normal parsing; it derives
    the variable name `_{PROG_NAME}_COMPLETE`, returns if it is unset, and otherwise calls `shell_completion.shell_complete`
    and exits with its return code.

    2. `shell_complete` splits the instruction into shell and action, looks up the completion class with
    `get_completion_class` (Bash here), and for the `complete` action echoes the result of `complete()`.

    3. `ShellComplete.complete` gets the arguments and the incomplete word, calls `get_completions`, and
    joins one formatted line per item.

    4. `BashComplete.get_completion_args` splits `COMP_WORDS`, uses `COMP_CWORD` to separate the finished
    arguments from the word being completed.

    5. `ShellComplete.get_completions` builds the context with `_resolve_context`, picks the object to
    complete with `_resolve_incomplete`, and calls that object''s `shell_complete`.

    6. `_resolve_context` makes the root context with `resilient_parsing=True` and walks down through
    any subcommands already typed, using `resolve_command` and `make_context`, without running callbacks.

    7. `_resolve_incomplete` sees that the incomplete word is not an option and no argument is waiting
    for a value, so it returns the current command (the group).

    8. `Group.shell_complete` yields a `CompletionItem` for each visible subcommand whose name starts
    with the incomplete word (with its short help), then appends whatever the base `Command.shell_complete`
    adds (option names only when the word starts with a non-alphanumeric character, and siblings from
    chained parent groups); `BashComplete.format_completion` writes each item as `type,value`.'
  must_cite:
  - py:src/click/core.py:Command._main_shell_completion:method
  - py:src/click/shell_completion.py:shell_complete:function
  - py:src/click/shell_completion.py:ShellComplete.complete:method
  - py:src/click/shell_completion.py:BashComplete.get_completion_args:method
  - py:src/click/shell_completion.py:ShellComplete.get_completions:method
  - py:src/click/shell_completion.py:_resolve_context:function
  - py:src/click/shell_completion.py:_resolve_incomplete:function
  - py:src/click/core.py:Group.shell_complete:method
  answer: '**Entry point:** `Command._main_shell_completion` builds the env var name (`_CLI_COMPLETE`)
    and reads its value (`bash_complete`). If the value is set, it calls `shell_complete` and exits with
    the returned status code. [c1]


    **Dispatch:** `shell_complete` splits the value on `_` into shell `bash` and instruction `complete`.
    It looks up the completion class and creates it with the CLI, args and program name. For the `complete`
    instruction it echoes `comp.complete()` encoded as bytes and returns 0. [c2]


    **Candidate computation:** The evidence does not include `ShellComplete.complete` or `get_completions`.
    It does show the pieces they would use. `_resolve_incomplete` picks the Click object that handles
    the incomplete word. When no option or argument is pending, it returns the group command. [c3] `Group.shell_complete`
    then builds a `CompletionItem` for each visible subcommand whose name matches the incomplete text,
    with the command''s short help. It also adds the results from the base `Command.shell_complete`. [c4]


    **Printing:** `BashComplete.format_completion` formats each item as `type,value`, for example `plain,sync`.
    [c5] The exact loop that joins items into the final output is not shown in the evidence.


    Claims:

    - _main_shell_completion reads the completion env var (default _{PROG_NAME}_COMPLETE uppercased),
    and if set calls shell_complete and exits with its return value.

    - shell_complete partitions the instruction on "_" into shell and instruction, instantiates the completion
    class, and for "complete" echoes comp.complete() encoded and returns 0.

    - _resolve_incomplete returns ctx.command when no option or argument is pending, so a group provides
    command name completions.

    - Group.shell_complete builds CompletionItems from visible subcommands matching the incomplete text,
    with short help, and extends them with the base class results.

    - BashComplete formats each item as "type,value".'
