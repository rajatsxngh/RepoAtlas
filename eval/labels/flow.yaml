- id: f03
  question_id: remeda-flow-004
  question: With the default trailing timing, how does a call to a `debounce`d function end up invoking
    the wrapped function after the wait elapses?
  reference_outline: '1. `debounce` validates that `maxWaitMs` is not less than `waitMs` and returns an
    object whose `call` closes over the cool-down and max-wait timer IDs, the latest arguments, and the
    last result.

    2. On `call` with trailing timing, `handleDebouncedCall` saves the arguments as the latest call arguments
    and, if `maxWaitMs` is set and no max-wait timer is running, starts one that will run `handleInvoke`.

    3. `call` clears any running cool-down timer and starts a new one for `waitMs` (falling back to `maxWaitMs`,
    then 0) pointing at `handleCoolDownEnd`, then returns the cached result from the previous invocation.

    4. When the cool-down timer fires, `handleCoolDownEnd` clears the timer and, if latest arguments are
    stored, calls `handleInvoke`.

    5. `handleInvoke` clears the max-wait timer, takes and clears the stored arguments, calls the wrapped
    function with them, and caches its return value as the new result.'
  must_cite:
  - ts:packages/remeda/src/debounce.ts:debounce:function
  - ts:packages/remeda/src/debounce.ts:debounce.handleDebouncedCall:function
  - ts:packages/remeda/src/debounce.ts:debounce.handleCoolDownEnd:function
  - ts:packages/remeda/src/debounce.ts:debounce.handleInvoke:function
  answer: 'With the default `trailing` timing, the first call starts a cool-down window and is treated
    as a debounced call. The args are saved, and the wrapped function is invoked later by a timer, not
    directly.


    1. `timing` defaults to `"trailing"`. [c1]

    2. If no cool-down timeout is active, the call starts a new window. In `trailing` mode it goes to
    `handleDebouncedCall` instead of calling `func` directly. [c2]

    3. `handleDebouncedCall` stores the args in `latestCallArgs`. It also starts a `maxWaitMs` timeout
    if one is configured and none is running. [c3]

    4. `call` then schedules `handleCoolDownEnd` with `setTimeout` for `waitMs ?? maxWaitMs ?? 0`. [c4]

    5. Any further call during the window is also debounced, so the latest args are saved. The current
    timeout is cleared and a new full wait begins. [c5]

    6. When the timer fires, `handleCoolDownEnd` clears the cool-down timeout. If `latestCallArgs` is
    set, it calls `handleInvoke`. [c6]

    7. `handleInvoke` clears any `maxWait` timer and takes the saved args. It resets `latestCallArgs`,
    calls `func(...args)` and stores the result in `result`, which is later exposed as `cachedValue`.
    [c7]


    The test shows a trailing call invoking the function only after the wait has passed. [c8]


    Claims:

    - The `timing` option defaults to "trailing".

    - When no cool-down timeout is active and timing is "trailing", the first call is passed to handleDebouncedCall
    rather than invoking func directly.

    - handleDebouncedCall saves the call args in latestCallArgs and starts the maxWait timeout once if
    maxWaitMs is defined.

    - After handling the call, call schedules handleCoolDownEnd via setTimeout with waitMs ?? maxWaitMs
    ?? 0.

    - Calls made during an in-flight cool-down window (non-leading) are debounced and clear the current
    timeout so a full wait restarts.

    - handleCoolDownEnd clears the cool-down timeout and, if latestCallArgs is defined, calls handleInvoke.

    - handleInvoke clears the maxWait timeout, takes and resets latestCallArgs, and calls func with those
    args, storing the return value in result.

    - A test with trailing timing shows the mock is not called immediately but is called once after the
    wait.'
