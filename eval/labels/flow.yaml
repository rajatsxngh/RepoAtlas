- id: f02
  question_id: zod-flow-004
  question: When a classic schema has `.transform(fn)` and you parse a value, how is the value validated
    first and then handed to `fn`, and what stops `fn` from running on invalid input?
  reference_outline: '1. The `.transform(fn)` method on classic `ZodType` builds `pipe(this, transform(fn))`:
    `transform` creates a `ZodTransform` whose def holds `fn`, and `pipe` creates a `ZodPipe` with the
    original schema as `in` and the transform as `out`.

    2. The `parse` installed by `$ZodPipe` (forward direction) runs the `in` schema on the payload first.

    3. `handlePipeResult` stops the pipe if the left result has any issue other than `unrecognized_keys`:
    it marks the payload aborted and returns it, so `fn` never runs.

    4. Otherwise it runs the `out` schema on a payload carrying the validated value and the existing issues.

    5. The classic `ZodTransform` replaces the core transform''s `parse`: it throws for encode (backward)
    direction, attaches an `addIssue` helper to the payload, calls `fn` with the value and payload, and
    stores the result (awaiting it if `fn` returns a promise) as the new value.'
  must_cite:
  - ts:packages/zod/src/v4/classic/schemas.ts:transform:function
  - ts:packages/zod/src/v4/classic/schemas.ts:pipe:function
  - ts:packages/zod/src/v4/core/schemas.ts:$ZodPipe:function
  - ts:packages/zod/src/v4/core/schemas.ts:handlePipeResult:function
  - ts:packages/zod/src/v4/classic/schemas.ts:ZodTransform:function
  answer: 'The evidence only partly answers this. It shows how `.transform` is constructed and how the
    top-level parse treats issues, but it does not include the code that sequences validation before `fn`
    runs.


    - In v3, `.transform(fn)` wraps the schema in a `ZodEffects` with `schema: this` and a transform effect
    [c1]. This suggests the inner schema is the one validated, but the code that applies the effect is
    not in the evidence.

    - In v4 classic, the standalone `transform(fn)` creates a `ZodTransform` with `type: "transform"`
    and `transform: fn` [c2]. The core `_transform` helper does the same [c3].

    - `parse` calls `schema._zod.run` on a payload `{ value, issues: [] }` [c4]. It throws if the result
    has issues, so an invalid result never returns a value [c4]. The async variant does the same after
    awaiting [c5].


    The v4 `$ZodTransform` run implementation, and the pipe or check logic that stops `fn` from executing
    on invalid input, are not in the indexed code. I can''t confirm that mechanism from this evidence.


    Claims:

    - In v3, the `transform` method returns a `ZodEffects` that wraps the original schema (`schema: this`)
    with a transform effect holding the function.

    - The classic v4 `transform` function constructs a `ZodTransform` with type "transform" and the user
    function as `transform`.

    - The core `_transform` helper builds a schema of the given Class with type "transform" and the function
    as `transform`.

    - Sync parse runs `schema._zod.run` on a payload with an empty issues array and throws an error if
    the result has issues, otherwise returns `result.value`.

