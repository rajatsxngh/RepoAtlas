      \ !== undefined;\n    },\n\n    get cachedValue() {\n      return result;\n    },\n  };\n}"
    packages/remeda/src/debounce.ts#L113-L230@6d9de4c: "export function debounce<F extends StrictFunction>(\n\
      \  func: F,\n  {\n    waitMs,\n    timing = \"trailing\",\n    maxWaitMs,\n  }: DebounceOptions\
      \ & {\n    readonly timing?: \"both\" | \"leading\" | \"trailing\";\n  },\n): Debouncer<F> {\n \
      \ if (maxWaitMs !== undefined && waitMs !== undefined && maxWaitMs < waitMs) {\n    throw new Error(\n\
      \      `debounce: maxWaitMs (${maxWaitMs.toString()}) cannot be less than waitMs (${waitMs.toString()})`,\n\
      \    );\n  }\n\n  // All these are part of the debouncer runtime state:\n\n  // The timeout is the\
      \ main object we use to tell if there's an active cool-\n  // down period or not.\n  let coolDownTimeoutId:\
      \ ReturnType<typeof setTimeout> | undefined;\n\n  // We use an additional timeout to track how long\
      \ the last debounced call is\n  // waiting.\n  let maxWaitTimeoutId: ReturnType<typeof setTimeout>\
      \ | undefined;\n\n  // For 'trailing' invocations we need to keep the args around until we\n  //\
      \ actually invoke the function.\n  let latestCallArgs: Parameters<F> | undefined;\n\n  // To make\
      \ any value of the debounced function we need to be able to return a\n  // value. For any invocation\
      \ except the first one when 'leading' is enabled we\n  // will return this cached value.\n  let\
      \ result: ReturnType<F> | undefined;\n\n  const handleInvoke = (): void => {\n    if (maxWaitTimeoutId\
      \ !== undefined) {\n      // We are invoking the function so the wait is over...\n      const timeoutId\
      \ = maxWaitTimeoutId;\n      maxWaitTimeoutId = undefined;\n      clearTimeout(timeoutId);\n   \
      \ }\n\n    /* v8 ignore if -- This protects us against changes to the logic, there is no known flow\
      \ we can simulate to reach this condition. It can only happen if a previous timeout isn't cleared\
      \ (or faces a race condition clearing). @preserve */\n    if (latestCallArgs === undefined) {\n\
      \      // If you see this error pop up when using this function please report\n      // it on the\
      \ Remeda github page!\n      throw new Error(\n        \"REMEDA[debounce]: latestCallArgs was unexpectedly\
      \ undefined.\",\n      );\n    }\n\n    const args = latestCallArgs;\n    // Make sure the args\
      \ aren't accidentally used again, this is mainly\n    // relevant for the check above where we'll\
      \ fail a subsequent call to\n    // 'trailingEdge'.\n    latestCallArgs = undefined;\n\n    // Invoke\
      \ the function and store the results locally.\n    // @ts-expect-error [ts2345, ts2322] -- TypeScript\
      \ infers the generic sub-\n    // types too eagerly, making itself blind to the fact that the types\
      \ match\n    // here.\n    result = func(...args);\n  };\n\n  const handleCoolDownEnd = (): void\
      \ => {\n    if (coolDownTimeoutId === undefined) {\n      // It's rare to get here, it should only\
      \ happen when `flush` is called\n      // when the cool-down window isn't active.\n      return;\n\
      \    }\n\n    // Make sure there are no more timers running.\n    const timeoutId = coolDownTimeoutId;\n\
      \    coolDownTimeoutId = undefined;\n    clearTimeout(timeoutId);\n    // Then reset state so a\
      \ new cool-down window can begin on the next call.\n\n    if (latestCallArgs !== undefined) {\n\
      \      // If we have a debounced call waiting to be invoked at the end of the\n      // cool-down\
      \ period we need to invoke it now.\n      handleInvoke();\n    }\n  };\n\n  const handleDebouncedCall\
      \ = (args: Parameters<F>): void => {\n    // We save the latest call args so that (if and) when\
      \ we invoke the function\n    // in the future, we have args to invoke it with.\n    latestCallArgs\
      \ = args;\n\n    if (maxWaitMs !== undefined && maxWaitTimeoutId === undefined) {\n      // We only\
      \ need to start the maxWait timeout once, on the first debounced\n      // call that is now being\
      \ delayed.\n      maxWaitTimeoutId = setTimeout(handleInvoke, maxWaitMs);\n    }\n  };\n\n  return\
      \ {\n    call: (...args) => {\n      if (coolDownTimeoutId === undefined) {\n        // This call\
      \ is starting a new cool-down window!\n\n        if (timing === \"trailing\") {\n          // Only\
      \ when the timing is \"trailing\" is the first call \"debounced\".\n          handleDebouncedCall(args);\n\
      \        } else {\n          // Otherwise for \"leading\" and \"both\" the first call is actually\n\
      \          // called directly and not via a timeout.\n          // @ts-expect-error [ts2345, ts2322]\
      \ -- TypeScript infers the generic\n          // sub-types too eagerly, making itself blind to the\
      \ fact that the\n          // types match here.\n          result = func(...args);\n        }\n\
      \      } else {\n        // There's an inflight cool-down window.\n\n        if (timing !== \"leading\"\
      ) {\n          // When the timing is 'leading' all following calls are just ignored"
