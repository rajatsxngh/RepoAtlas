# M07 smoke run: 20 questions on one pinned repo, answered live with a cost cap.
#   cd backend && uv run repoatlas ask-smoke --snapshot <id> --max-cost 2.00
# Answerable questions name the symbols a good answer cites (noted by hand from the snapshot's
# graph); a run counts whether any of them was cited, but doesn't require it. Unanswerable
# questions ask about things the repository doesn't do; they must be refused for evidence.
repo: colinhacks/zod
